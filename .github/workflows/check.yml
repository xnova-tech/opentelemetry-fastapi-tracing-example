name: Check OpenTelemetry FastAPI tracing example

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  python:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: requirements-dev.txt
      - run: python -m pip install -r requirements-dev.txt
      - name: Check formatting and lint
        run: |
          python -m ruff format --check .
          python -m ruff check .
      - name: Run deterministic trace observation
        run: python check_traces.py
      - name: Run pytest contracts
        run: python -m pytest -q

  compose:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: requirements.txt
      - run: python -m pip install -r requirements.txt
      - name: Validate and start the stack
        run: |
          docker compose config -q
          docker compose up --detach --build
      - name: Check Collector, Tempo and Grafana pipeline
        run: python inspect_stack.py
      - name: Check missing propagation
        run: |
          PROPAGATION_ENABLED=false docker compose up --detach --force-recreate gateway
          python inspect_stack.py --expect-unlinked
      - name: Check propagation recovery
        run: |
          PROPAGATION_ENABLED=true docker compose up --detach --force-recreate gateway
          python inspect_stack.py
      - name: Show logs after failure
        if: failure()
        run: docker compose logs --no-color
      - name: Stop the stack
        if: always()
        run: docker compose down --volumes
