[project]
name = "opentelemetry-fastapi-tracing-example"
version = "0.1.0"
description = "Two FastAPI services with manual OpenTelemetry trace propagation"
readme = "README.md"
requires-python = ">=3.12,<3.13"
dependencies = [
  "fastapi==0.128.2",
  "httpx==0.28.1",
  "opentelemetry-api==1.42.1",
  "opentelemetry-exporter-otlp-proto-http==1.42.1",
  "opentelemetry-sdk==1.42.1",
  "uvicorn==0.48.0",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]

[tool.ruff]
target-version = "py312"
line-length = 110
cache-dir = "/tmp/ruff-cache"

[tool.ruff.lint]
select = ["ANN", "B", "C90", "E", "F", "I", "RUF", "SIM", "UP"]
